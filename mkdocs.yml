site_name: SIGGD Docs
site_url: https://PurdueSIGGD.github.io/SIGGD-Docs/
site_author: Purdue SIGGD
site_description: >-
  Documentation, tutorials, and resources for Purdue's Special Interest Group
  in Game Development.

repo_name: PurdueSIGGD/SIGGD-Docs
repo_url: https://github.com/PurdueSIGGD/SIGGD-Docs
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Purdue SIGGD

hooks:
  # google_docs runs before author_attribution so the attribution block stays
  # at the very bottom of a page that ends with an embed.
  - hooks/google_docs.py
  - hooks/author_attribution.py
  - hooks/section_nav.py

# ── Theme ──────────────────────────────────────────────────────────────────────
# Overriden by assets/stylesheets/extra.css for custom colors; make changes there
theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  language: en

  # Dark only. A single entry with no `toggle` removes the light/dark switch
  # from the header entirely, and no `media` key means the OS theme is ignored.
  # This also overrides any stale palette choice a returning visitor has saved
  # in local storage, since there is only one palette left to select.
  palette:
    - scheme: slate
      primary: black
      accent: red

  font:
    text: Inter
    code: JetBrains Mono

  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # `tags_file` was deprecated in Material 9.x. The listing is now placed with a
  # `<!-- material/tags -->` directive inside docs/tags.md instead.
  - tags
  - git-authors:
      show_contribution: true
      show_line_count: true
      count_empty_lines: false
      fallback_to_empty: false
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true

# ── Navigation ────────────────────────────────────────────────────────────────
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Programming:
          - tutorials/programming/index.md
          - Onboarding Workshops:
              - How Unity Thinks: tutorials/programming/how-unity-thinks.md
              - Designing a System: tutorials/programming/designing-a-system.md
              - Data-Driven Design: tutorials/programming/data-driven-design.md
              - The OOP Toolkit: tutorials/programming/oop-toolkit.md
          - Reference:
              - C# Style Guide: tutorials/programming/csharp-style-guide.md
              - C# for Unity: tutorials/programming/csharp-for-unity.md
              - Thinking Like an Engineer: tutorials/programming/thinking-like-an-engineer.md
      - Art & Assets:
          - tutorials/art-and-assets/index.md
      - Audio:
          - tutorials/audio/index.md
      - Story:
          - tutorials/story/index.md
          - Story Team Standards: tutorials/story/story-team-standards.md
          - Story Design Doc: tutorials/story/story-design-doc.md
          - Story Team Tasks: tutorials/story/story-tasks.md
          - Story Team Onboarding: tutorials/story/story-team-onboarding.md
      - General:
          - tutorials/general/index.md
          - Getting Set Up: tutorials/general/getting-set-up.md
          - Git Guides:
            - First Commits: tutorials/general/gitgood.md
            - The PR Workflow: tutorials/general/gitgood2.md
  - Projects:
      - projects/index.md
      - 26-27 Game:
          - Overview: projects/2627-game/index.md
          - Codebase:
              - projects/2627-game/codebase/index.md
              - Systems: projects/2627-game/codebase/systems/index.md
              - Scripts: projects/2627-game/codebase/scripts/index.md
          - Story:
              - projects/2627-game/story/index.md
              - Story Design Document: projects/2627-game/story/story-design-doc.md
              - Story Team Task List: projects/2627-game/story/story-tasks.md
          - Team: projects/2627-game/team.md
  - Resources:
      - resources/index.md
      - Tools: resources/tools.md
      - External References: resources/external-references.md
  - Contributing:
      - contributing/index.md
      - Style Guide: contributing/style-guide.md
      - Markdown Cheatsheet: contributing/markdown-cheatsheet.md
      - Templates:
          - Tutorial Template: contributing/templates/tutorial-template.md
          - Project Template: contributing/templates/project-template.md
          - Codebase Template: contributing/templates/codebase-template.md
          - System Template: contributing/templates/system-template.md
          - Script Template: contributing/templates/script-template.md
          - Resource Template: contributing/templates/resource-template.md
          - Google Doc Template: contributing/templates/google-doc-template.md
  - About:
      - about/index.md
      - Contributors: about/contributors.md

# ── Markdown Extensions ───────────────────────────────────────────────────────
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ── Extra ──────────────────────────────────────────────────────────────────────
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PurdueSIGGD
      name: PurdueSIGGD on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/nKdj4bTjNs
      name: Join our Discord

# No `consent:` block on purpose. This site sets no cookies: there is no
# analytics, and Material only ever writes UI preferences (selected content tab,
# cached repo stars) to the browser's own storage. A consent banner here would
# only be asking permission for the banner itself.

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  # extra.js configures MathJax and loads it from unpkg only on pages that
  # actually contain math, so every other page makes no request to unpkg.
  - assets/javascripts/extra.js
  - assets/javascripts/toc-collapse.js
